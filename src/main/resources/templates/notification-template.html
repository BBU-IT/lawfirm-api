<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="${subject}">Law Firm Notification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    .header {
      background-color: #004080;
      color: white;
      padding: 10px;
      text-align: center;
    }
    .content {
      margin: 20px;
    }
    .footer {
      margin: 20px;
      font-size: 0.9em;
      color: #777;
    }
    .button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #004080;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
<div class="header">
  <h2 th:text="${subject}">Law Firm Notification</h2>
</div>

<div class="content">
  <p>Hello <strong th:text="${user}">User</strong>,</p>

  <p>Your law case <strong th:text="${caseId}">#12345</strong> is currently pending with your assigned lawyer.</p>

  <p>We will notify you once there is an update on your case.</p>
  <p>Here is your profile picture </p>

  <img th:src="@{clientImage}" alt="Mountain View" style="width:304px;height:228px">

  <a th:href="${caseLink}" class="button">View Case Status</a>
</div>

<div class="footer">
  <p>GCLaw Group &copy; 2025. All rights reserved.</p>
</div>
</body>
</html>
