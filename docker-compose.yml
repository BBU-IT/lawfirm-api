version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pg-container            # optional, you can remove this line
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: lawfirm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  lawfirm-app:                              # your Spring Boot app
    image: lawfirm-api-image:latest
    build: .                                # remove if you already have an image
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lawfirm_db
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: